<main><section class="intro"><p class="eyebrow" data-i="eyebrow">СПРАВОЧНЫЙ РАЗДЕЛ · RU / EN</p><h1 data-i="title">Словарь химии</h1><p class="lead" data-i="lead">Ключевые понятия химии — от атома и моля до кислотности и окислительно-восстановительных процессов.</p></section>

<script>
const entries=[
["Атом","Atom","Наименьшая электрически нейтральная частица химического элемента, сохраняющая его химическую идентичность.","The smallest electrically neutral unit of an element that retains its chemical identity.","matter"],
["Атомное число","Atomic number","Число протонов в ядре атома; определяет, к какому химическому элементу относится атом.","The number of protons in an atom's nucleus; it defines the element.","matter"],
["Изотоп","Isotope","Разновидность атомов одного элемента с одинаковым числом протонов, но разным числом нейтронов.","Atoms of the same element with equal proton counts but different neutron counts.","matter"],
["Ион","Ion","Атом или группа атомов с электрическим зарядом из-за потери или присоединения электронов.","An atom or group of atoms with a net charge due to electron loss or gain.","matter"],
["Молекула","Molecule","Электрически нейтральная группа атомов, связанных химическими связями.","An electrically neutral group of atoms held together by chemical bonds.","matter"],
["Химический элемент","Chemical element","Вид атомов с одинаковым числом протонов в ядре.","A type of atom defined by the same number of protons in its nucleus.","matter"],
["Периодический закон","Periodic law","Свойства элементов и их соединений периодически зависят от атомного номера.","The properties of elements and their compounds are periodic functions of atomic number.","matter"],
["Валентные электроны","Valence electrons","Электроны внешнего энергетического уровня, участвующие в образовании химических связей.","Electrons in the outer energy level that participate in chemical bonding.","matter"],
["Ковалентная связь","Covalent bond","Химическая связь, возникающая при совместном использовании атомами одной или нескольких электронных пар.","A chemical bond formed when atoms share one or more pairs of electrons.","matter"],
["Ионная связь","Ionic bond","Электростатическое притяжение между противоположно заряженными ионами.","Electrostatic attraction between oppositely charged ions.","matter"],
["Электроотрицательность","Electronegativity","Способность атома притягивать общую электронную пару в химической связи.","The tendency of an atom to attract shared electrons in a chemical bond.","matter"],
["Моль","Mole","Единица количества вещества; один моль содержит ровно 6,02214076 × 10²³ элементарных сущностей.","The unit of amount of substance; one mole contains exactly 6.02214076 × 10²³ specified entities.","matter"],
["Молярная масса","Molar mass","Масса одного моля вещества; обычно выражается в г/моль.","The mass of one mole of a substance, commonly expressed in g/mol.","matter"],
["Химическая реакция","Chemical reaction","Процесс превращения исходных веществ в продукты посредством перестройки химических связей.","A process in which reactants become products through rearrangement of chemical bonds.","reaction"],
["Катализатор","Catalyst","Вещество, изменяющее скорость реакции и регенерирующееся в ходе механизма реакции.","A substance that changes reaction rate and is regenerated in the reaction mechanism.","reaction"],
["Окисление","Oxidation","Процесс отдачи электронов; степень окисления при этом повышается.","Loss of electrons; the oxidation state increases.","reaction"],
["Восстановление","Reduction","Процесс присоединения электронов; степень окисления при этом понижается.","Gain of electrons; the oxidation state decreases.","reaction"],
["Степень окисления","Oxidation state","Условный заряд атома в соединении при формальном отнесении электронов связи к более электроотрицательному атому.","The formal charge assigned to an atom when bonding electrons are allocated to the more electronegative atom.","reaction"],
["Экзотермическая реакция","Exothermic reaction","Реакция, при которой система выделяет энергию в окружающую среду; при постоянном давлении ΔH < 0.","A reaction that releases energy to its surroundings; at constant pressure, ΔH < 0.","reaction"],
["Эндотермическая реакция","Endothermic reaction","Реакция, при которой система поглощает энергию из окружающей среды; при постоянном давлении ΔH > 0.","A reaction that absorbs energy from its surroundings; at constant pressure, ΔH > 0.","reaction"],
["Раствор","Solution","Однородная смесь растворителя и одного или нескольких растворённых веществ.","A homogeneous mixture of a solvent and one or more solutes.","solution"],
["Концентрация","Concentration","Количественная характеристика содержания компонента в заданном объёме или массе смеси.","A quantitative measure of the amount of a component in a given volume or mass of mixture.","solution"],
["Молярная концентрация","Molar concentration","Количество растворённого вещества, делённое на объём раствора; единица СИ — моль/м³, часто используют моль/л.","Amount of dissolved substance divided by solution volume; commonly expressed in mol/L.","solution"],
["Кислота","Acid","По Бренстеду—Лоури, частица, способная отдавать протон H⁺.","In Brønsted–Lowry theory, a species capable of donating a proton, H⁺.","solution"],
["Основание","Base","По Бренстеду—Лоури, частица, способная принимать протон H⁺.","In Brønsted–Lowry theory, a species capable of accepting a proton, H⁺.","solution"],
["pH","pH","Величина, связанная с активностью ионов водорода; в разбавленных растворах часто приближённо pH = −log₁₀[H⁺].","A measure related to hydrogen-ion activity; in dilute solutions pH is often approximated by −log₁₀[H⁺].","solution"],
["Нейтрализация","Neutralization","Реакция кислоты и основания; для сильной кислоты и сильного основания в водном растворе часто приводит к образованию воды и соли.","An acid–base reaction; strong acid–strong base reactions in water commonly form water and a salt.","solution"],
["Углеводород","Hydrocarbon","Органическое соединение, состоящее только из атомов углерода и водорода.","An organic compound containing only carbon and hydrogen.","organic"],
["Алкан","Alkane","Насыщенный ациклический углеводород с общей формулой CₙH₂ₙ₊₂.","A saturated acyclic hydrocarbon with the general formula CₙH₂ₙ₊₂.","organic"],
["Функциональная группа","Functional group","Атом или группа атомов, определяющая характерные реакции органического соединения.","An atom or group of atoms responsible for characteristic reactions of an organic compound.","organic"],
["Полимер","Polymer","Вещество, молекулы которого состоят из повторяющихся структурных звеньев.","A substance whose molecules consist of repeating structural units.","organic"]
];
const labels={ru:{all:"Все темы",matter:"Вещество",reaction:"Реакции",solution:"Растворы",organic:"Органическая химия",empty:"Ничего не найдено. Попробуйте изменить запрос.",placeholder:"Найти термин или определение…",count:"терминов найдено"},en:{all:"All topics",matter:"Matter",reaction:"Reactions",solution:"Solutions",organic:"Organic chemistry",empty:"No matches. Try a different search.",placeholder:"Search terms or definitions…",count:"terms found"}};
let lang="ru";

function translate(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(e=>{const v=({ru:{ptable:"Периодическая таблица ↗",eyebrow:"СПРАВОЧНЫЙ РАЗДЕЛ · RU / EN",title:"Словарь химии",lead:"Ключевые понятия химии — от атома и моля до кислотности и окислительно-восстановительных процессов.",foot:"СЛОВАРЬ ХИМИИ · RU / EN"},en:{ptable:"Periodic table ↗",eyebrow:"REFERENCE · RU / EN",title:"Chemistry glossary",lead:"Essential chemistry concepts — from atoms and moles to acidity and redox processes.",foot:"CHEMISTRY GLOSSARY · RU / EN"}})[lang][e.dataset.i];if(v)e.textContent=v});document.getElementById("lang").textContent=lang==="ru"?"EN":"RU";document.getElementById("search").placeholder=labels[lang].placeholder;document.getElementById("search").setAttribute("aria-label",labels[lang].placeholder);const sel=document.getElementById("category");[...sel.options].forEach(o=>o.textContent=labels[lang][o.value]);document.getElementById("empty").textContent=labels[lang].empty;render();}
document.getElementById("lang").addEventListener("click",()=>{lang=lang==="ru"?"en":"ru";translate()});document.getElementById("search").addEventListener("input",render);document.getElementById("category").addEventListener("change",render);translate();
</script></body></html>
