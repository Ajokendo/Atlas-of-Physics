<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Electron probability cloud</title><desc id="desc">A scientific editorial illustration of an atomic nucleus surrounded by translucent electron probability clouds.</desc>
<defs>
 <radialGradient id="paper"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#e9e8df"/></radialGradient>
 <radialGradient id="nucleus"><stop stop-color="#d88b69"/><stop offset=".62" stop-color="#b75e4d"/><stop offset="1" stop-color="#8e4b45"/></radialGradient>
 <radialGradient id="cloud"><stop stop-color="#82b9aa" stop-opacity=".02"/><stop offset=".55" stop-color="#79ad9f" stop-opacity=".28"/><stop offset="1" stop-color="#6c9d91" stop-opacity=".04"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="720" fill="url(#paper)"/>
<g opacity=".28" stroke="#b8b9ac" stroke-width="1" fill="none"><path d="M0 590H1200M0 130H1200"/><circle cx="600" cy="355" r="260"/><circle cx="600" cy="355" r="205"/></g>
<g transform="translate(600 355)">
 <ellipse rx="350" ry="145" transform="rotate(-25)" fill="url(#cloud)"/>
 <ellipse rx="340" ry="150" transform="rotate(55)" fill="url(#cloud)"/>
 <ellipse rx="250" ry="180" transform="rotate(115)" fill="url(#cloud)"/>
 <ellipse rx="290" ry="120" transform="rotate(155)" fill="url(#cloud)"/>
 <g fill="none" stroke="#6f9e92" stroke-width="2" opacity=".55">
  <ellipse rx="320" ry="126" transform="rotate(-25)"/><ellipse rx="320" ry="126" transform="rotate(55)"/><ellipse rx="250" ry="170" transform="rotate(115)"/>
 </g>
 <circle r="68" fill="#b85f50" opacity=".16" filter="url(#blur)"/>
 <circle r="48" fill="url(#nucleus)"/>
 <g fill="#d78a6b"><circle cx="-17" cy="-13" r="17"/><circle cx="18" cy="-18" r="15"/><circle cx="21" cy="16" r="17"/><circle cx="-17" cy="19" r="15"/></g>
 <g fill="#78aeb6"><circle cx="0" cy="-29" r="14"/><circle cx="-31" cy="4" r="13"/><circle cx="0" cy="31" r="14"/><circle cx="31" cy="-1" r="13"/></g>
 <g fill="#f3d9bd" opacity=".8"><circle cx="-8" cy="-7" r="4"/><circle cx="20" cy="7" r="4"/><circle cx="-24" cy="20" r="3"/></g>
</g>
<g fill="#6f9e92" opacity=".9"><circle cx="840" cy="230" r="7"/><circle cx="315" cy="485" r="6"/><circle cx="735" cy="585" r="5"/></g>
<g fill="none" stroke="#c18b73" stroke-width="1.5" opacity=".7"><path d="M760 170l80-48 50 24"/><path d="M355 540l-80 48-55-15"/></g>
</svg>