<style>
:root{--paper:#f2f2ef;--card:#fbfbfa;--ink:#18181a;--text:#57575a;--muted:#85858a;--line:#deded9;--accent:#39836f;--serif:'EB Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;--mono:'JetBrains Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font:15px/1.65 var(--sans)}header{max-width:1050px;margin:auto;padding:20px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font:24px var(--serif);color:var(--ink);text-decoration:none}button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:10px 14px;color:var(--ink);font:11px var(--mono)}main{max-width:820px;margin:auto;padding:55px 24px 85px}.eyebrow,.meta{font:10px var(--mono);letter-spacing:.12em;color:var(--muted)}h1{font:400 clamp(48px,8vw,78px)/.98 var(--serif);color:var(--ink);margin:16px 0}.lead{font:italic 21px/1.5 var(--serif);color:#77736e;max-width:680px}.progress{height:4px;background:#e2e2dc;margin:30px 0 34px}.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.question{background:var(--card);border:1px solid var(--line);padding:24px;margin:15px 0}.qhead{display:flex;justify-content:space-between;gap:12px}.qhead b{font:10px var(--mono);color:var(--accent)}h2{font:27px/1.2 var(--serif);font-weight:400;color:var(--ink);margin:12px 0 18px}.answers{display:grid;gap:9px}.option{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);padding:12px;background:#fff;cursor:pointer;font-size:14px}.option:has(input:checked){border-color:var(--accent);background:#f1f6f2}.option input{margin-top:4px;accent-color:var(--accent)}.explain{display:none;margin-top:14px;padding:12px 14px;background:#f0f2ed;border-left:3px solid var(--accent);font-size:13px}.question.answered .explain{display:block}.question.answered .option{cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.primary{background:var(--accent);color:white;border-color:var(--accent)}.result{display:none;background:var(--card);border:1px solid var(--line);padding:28px;margin-top:28px}.result.show{display:block}.score{font:58px var(--serif);color:var(--ink)}.result h2{margin-top:0}.back{color:var(--accent);text-decoration:none;font:11px var(--mono)}@media(max-width:560px){header{padding:15px}.brand{font-size:20px}main{padding:38px 15px 65px}.question{padding:17px}h2{font-size:24px}}
</style></head><body><header><a class="brand" href="index.html">Atlas of Knowledge · Chemistry</a><button id="lang" type="button">EN</button></header><main><p class="eyebrow" data-i="eyebrow">САМОПРОВЕРКА · 10 ВОПРОСОВ</p><h1 data-i="title">Проверьте знания</h1><p class="lead" data-i="lead">Короткий тест охватывает ключевые идеи атласа — от строения атома до химических реакций. Выберите один ответ в каждом вопросе и получите пояснения.</p><div class="meta" id="counter">ВОПРОСЫ · 0 / 10</div><div class="progress"><span id="bar"></span></div><div id="quiz"></div><div class="actions"><button class="primary" id="finish" data-i="finish">Завершить тест</button><button id="reset" data-i="reset">Начать заново</button></div><section class="result" id="result" aria-live="polite"><p class="eyebrow" data-i="resultLabel">РЕЗУЛЬТАТ</p><div class="score" id="score">0 / 10</div><h2 id="rating"></h2><p id="summary"></p></section><p style="margin-top:35px"><a class="back" href="index.html" data-i="back">← ВЕРНУТЬСЯ В АТЛАС ХИМИИ</a></p></main>
<script>
const questions={
ru:[
{q:"Какая частица имеет отрицательный электрический заряд?",a:["Протон","Нейтрон","Электрон","Атомное ядро"],c:2,e:"Электрон имеет заряд −1e. Протон имеет +1e, нейтрон электрически нейтрален."},

{q:"Какой тип связи обычно образуется между Na и Cl в кристалле NaCl?",a:["Ковалентная неполярная","Металлическая","Ионная","Водородная"],c:2,e:"Натрий передаёт электрон хлору; в твёрдом NaCl кристалл образован ионами Na⁺ и Cl⁻."},
{q:"Сколько частиц содержит один моль вещества?",a:["6,022 × 10²³","3,14 × 10⁸","9,81 × 10²","1,00 × 10⁻³"],c:0,e:"Постоянная Авогадро равна точно 6,02214076 × 10²³ моль⁻¹."},

{q:"Какова общая формула ациклических алканов?",a:["CₙH₂ₙ","CₙH₂ₙ₊₂","CₙH₂ₙ₋₂","CₙHₙ"],c:1,e:"Для предельных ациклических углеводородов (алканов) общая формула CₙH₂ₙ₊₂."}

{q:"Which type of bonding is typically found between Na and Cl in crystalline NaCl?",a:["Nonpolar covalent","Metallic","Ionic","Hydrogen"],c:2,e:"Sodium transfers an electron to chlorine; solid NaCl is an ionic crystal of Na⁺ and Cl⁻."},
{q:"How many entities are in one mole of a substance?",a:["6.022 × 10²³","3.14 × 10⁸","9.81 × 10²","1.00 × 10⁻³"],c:0,e:"The Avogadro constant is exactly 6.02214076 × 10²³ mol⁻¹."},
{q:"What is the approximate molar mass of water, H₂O?",a:["10 g/mol","18 g/mol","20 g/mol","32 g/mol"],c:1,e:"M(H₂O) ≈ 2 × 1.008 + 16.00 = 18.02 g/mol."},
{q:"What does a solution concentration of 1 mol/L mean?",a:["1 mol of solvent in 1 L","1 mol of solute in 1 L of solution","1 g of solute in 1 L","1 mol of substance in 1 kg of solution"],c:1,e:"Molar concentration c = n/V, where V is the volume of the whole solution in litres."},
{q:"What pH value usually corresponds to neutral water at 25 °C?",a:["0","5","7","14"],c:2,e:"For neutral water at 25 °C, pH = 7. Neutrality means equal concentrations of H₃O⁺ and OH⁻."},
{q:"Which coefficient is needed before H₂ when balancing H₂ + O₂ → H₂O?",a:["1","2","3","4"],c:1,e:"The balanced equation is 2H₂ + O₂ → 2H₂O. Both sides contain the same numbers of H and O atoms."},

]};
const ui={ru:{eyebrow:"САМОПРОВЕРКА · 10 ВОПРОСОВ",title:"Проверьте знания",lead:"Короткий тест охватывает ключевые идеи атласа — от строения атома до химических реакций. Выберите один ответ в каждом вопросе и получите пояснения.",finish:"Завершить тест",reset:"Начать заново",resultLabel:"РЕЗУЛЬТАТ",back:"← ВЕРНУТЬСЯ В АТЛАС ХИМИИ",count:"ВОПРОСЫ",need:"Ответьте на все вопросы, чтобы увидеть результат.",excellent:"Отличный результат!",good:"Хорошая работа!",review:"Есть темы для повторения.",score:"Правильных ответов",explain:"Пояснение"},en:{eyebrow:"KNOWLEDGE CHECK · 10 QUESTIONS",title:"Test your knowledge",lead:"This short quiz covers key ideas from the atlas — from atomic structure to chemical reactions. Choose one answer per question and read the explanations.",finish:"Finish quiz",reset:"Start again",resultLabel:"RESULT",back:"← BACK TO THE CHEMISTRY ATLAS",count:"QUESTIONS",need:"Answer every question to see your result.",excellent:"Excellent result!",good:"Well done!",review:"Some topics are worth revisiting.",score:"Correct answers",explain:"Explanation"}};
let lang="ru",answers=Array(10).fill(null),locked=false;
function render(){const d=questions[lang],u=ui[lang];document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=u[e.dataset.i]);document.getElementById("lang").textContent=lang==="ru"?"EN":"RU";document.getElementById("quiz").innerHTML=d.map((q,i)=>'<section class="question" id="q'+i+'"><div class="qhead"><b>'+(lang==="ru"?"ВОПРОС ":"QUESTION ")+(i+1).toString().padStart(2,"0")+'</b><span class="meta">'+(i+1)+' / 10</span></div><h2>'+q.q+'</h2><div class="answers">'+q.a.map((a,j)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+j+'" '+(answers[i]===j?"checked":"")+' '+(locked?"disabled":"")+'><span>'+a+'</span></label>').join("")+'</div><div class="explain"><b>'+u.explain+':</b> '+q.e+'</div></section>').join("");d.forEach((q,i)=>{document.querySelectorAll('input[name="q'+i+'"]').forEach(el=>el.addEventListener("change",()=>{answers[i]=+el.value;updateProgress()}))});updateProgress()}
function saveAssessment(key,result){try{const historyKey=key+"-history-v1";let history=[];try{history=JSON.parse(localStorage.getItem(historyKey)||"[]")}catch{}if(!Array.isArray(history))history=[];if(!history.length){let previous=null;try{previous=JSON.parse(localStorage.getItem(key)||"null")}catch{}if(previous&&Number.isFinite(previous.score)&&previous.date)history.push(previous)}history.push(result);localStorage.setItem(historyKey,JSON.stringify(history));localStorage.setItem(key,JSON.stringify(result))}catch{}}
function updateProgress(){const n=answers.filter(x=>x!==null).length;document.getElementById("counter").textContent=ui[lang].count+" · "+n+" / 10";document.getElementById("bar").style.width=(n*10)+"%"}
document.getElementById("finish").addEventListener("click",()=>{if(answers.some(x=>x===null)){document.getElementById("counter").textContent=ui[lang].need;return}locked=true;const qs=questions[lang],score=answers.reduce((s,a,i)=>s+(a===qs[i].c?1:0),0);qs.forEach((q,i)=>{const el=document.getElementById("q"+i);el.classList.add("answered");el.querySelectorAll("input").forEach(x=>x.disabled=true);el.style.borderColor=answers[i]===q.c?"#39836f":"#b97958"});saveAssessment("atlas-chemistry-quiz-v1",{score,total:10,date:new Date().toISOString()})const r=document.getElementById("result");r.classList.add("show");document.getElementById("score").textContent=score+" / 10";document.getElementById("rating").textContent=score>=9?ui[lang].excellent:score>=7?ui[lang].good:ui[lang].review;document.getElementById("summary").textContent=ui[lang].score+": "+score+". "+(lang==="ru"?"Изучите пояснения к каждому вопросу, чтобы закрепить материал.":"Review the explanations to reinforce the material.");r.scrollIntoView({behavior:"smooth",block:"center"})});
document.getElementById("reset").addEventListener("click",()=>{answers=Array(10).fill(null);locked=false;document.getElementById("result").classList.remove("show");render();window.scrollTo({top:0,behavior:"smooth"})});document.getElementById("lang").addEventListener("click",()=>{lang=lang==="ru"?"en":"ru";render()});render();
