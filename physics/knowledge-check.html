<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2f2ef"><meta name="description" content="Билингвальный тест по физике: механика, энергия, колебания и электричество."><title>Проверка знаний по физике — Atlas of Knowledge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f2f2ef;--card:#fbfbfa;--ink:#18181a;--text:#57575a;--muted:#85858a;--line:#deded9;--accent:#b6533f;--serif:'EB Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;--mono:'JetBrains Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font:15px/1.65 var(--sans)}header{max-width:1050px;margin:auto;padding:20px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font:24px var(--serif);color:var(--ink);text-decoration:none}button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:10px 14px;color:var(--ink);font:11px var(--mono)}main{max-width:820px;margin:auto;padding:55px 24px 85px}.eyebrow,.meta{font:10px var(--mono);letter-spacing:.12em;color:var(--muted)}h1{font:400 clamp(48px,8vw,78px)/.98 var(--serif);color:var(--ink);margin:16px 0}.lead{font:italic 21px/1.5 var(--serif);color:#77736e;max-width:680px}.progress{height:4px;background:#e2e2dc;margin:30px 0 34px}.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.question{background:var(--card);border:1px solid var(--line);padding:24px;margin:15px 0}.qhead{display:flex;justify-content:space-between;gap:12px}.qhead b{font:10px var(--mono);color:var(--accent)}h2{font:27px/1.2 var(--serif);font-weight:400;color:var(--ink);margin:12px 0 18px}.answers{display:grid;gap:9px}.option{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);padding:12px;background:#fff;cursor:pointer;font-size:14px}.option:has(input:checked){border-color:var(--accent);background:#f8f1ee}.option input{margin-top:4px;accent-color:var(--accent)}.explain{display:none;margin-top:14px;padding:12px 14px;background:#f3efeb;border-left:3px solid var(--accent);font-size:13px}.question.answered .explain{display:block}.question.answered .option{cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.primary{background:var(--accent);color:white;border-color:var(--accent)}.result{display:none;background:var(--card);border:1px solid var(--line);padding:28px;margin-top:28px}.result.show{display:block}.score{font:58px var(--serif);color:var(--ink)}.result h2{margin-top:0}.back{color:var(--accent);text-decoration:none;font:11px var(--mono)}@media(max-width:560px){header{padding:15px}.brand{font-size:20px}main{padding:38px 15px 65px}.question{padding:17px}h2{font-size:24px}}
</style></head><body><header><a class="brand" href="index.html">Atlas of Knowledge · Physics</a><button id="lang" type="button">EN</button></header><main><p class="eyebrow" data-i="eyebrow">САМОПРОВЕРКА · 10 ВОПРОСОВ</p><h1 data-i="title">Проверьте знания</h1><p class="lead" data-i="lead">Тест охватывает основы механики, энергии, колебаний и электричества. Выберите один ответ в каждом вопросе и изучите пояснения.</p><div class="meta" id="counter">ВОПРОСЫ · 0 / 10</div><div class="progress"><span id="bar"></span></div><div id="quiz"></div><div class="actions"><button class="primary" id="finish" data-i="finish">Завершить тест</button><button id="reset" data-i="reset">Начать заново</button></div><section class="result" id="result" aria-live="polite"><p class="eyebrow" data-i="resultLabel">РЕЗУЛЬТАТ</p><div class="score" id="score">0 / 10</div><h2 id="rating"></h2><p id="summary"></p></section><p style="margin-top:35px"><a class="back" href="index.html" data-i="back">← ВЕРНУТЬСЯ В АТЛАС ФИЗИКИ</a></p></main>
<script>
const questions={ru:[
{q:"Какой величиной измеряется инертность тела?",a:["Скоростью","Массой","Ускорением","Силой"],c:1,e:"Масса является мерой инертности: чем больше масса, тем труднее изменить скорость тела."},
{q:"Как направлено ускорение при равномерном движении по окружности?",a:["По касательной","От центра","К центру окружности","Оно равно нулю"],c:2,e:"Центростремительное ускорение направлено к центру и изменяет направление скорости."},
{q:"Какова единица работы в СИ?",a:["Ньютон","Ватт","Джоуль","Паскаль"],c:2,e:"Работа измеряется в джоулях: 1 Дж = 1 Н·м."},
{q:"Что сохраняется в изолированной системе при столкновении тел?",a:["Суммарный импульс","Скорость каждого тела","Кинетическая энергия всегда","Ускорение"],c:0,e:"Полный импульс изолированной системы сохраняется независимо от типа столкновения."},
{q:"Как связаны частота f и период T колебаний?",a:["f = T","f = 1/T","f = T²","f = 2T"],c:1,e:"Частота — число колебаний в секунду, поэтому f = 1/T."},
{q:"Как изменится сила гравитационного взаимодействия, если расстояние увеличить в 2 раза?",a:["Увеличится в 2 раза","Уменьшится в 2 раза","Уменьшится в 4 раза","Не изменится"],c:2,e:"По закону обратных квадратов F пропорциональна 1/r²; при удвоении расстояния сила становится в 4 раза меньше."},
{q:"Какое выражение соответствует второму закону Ньютона?",a:["F = ma","p = mv","A = Fs","P = A/t"],c:0,e:"Равнодействующая сила равна произведению массы на ускорение: ΣF = ma."},
{q:"Что показывает электрический ток?",a:["Энергию заряда","Скорость света","Заряд, проходящий через сечение за единицу времени","Сопротивление проводника"],c:2,e:"Сила тока I = ΔQ/Δt — заряд, проходящий через поперечное сечение за единицу времени."},
{q:"Как связаны напряжение, ток и сопротивление в законе Ома для участка цепи?",a:["U = IR","I = UR","R = UI","U = I/R"],c:0,e:"Закон Ома: U = IR, где U — напряжение, I — ток, R — сопротивление."},
{q:"Какова потенциальная энергия тела массой m на высоте h у поверхности Земли?",a:["mv","mgh","½mv²","F/t"],c:1,e:"Вблизи поверхности Земли гравитационная потенциальная энергия относительно выбранного нуля равна Eₚ = mgh."}
],en:[
{q:"Which quantity measures an object's inertia?",a:["Speed","Mass","Acceleration","Force"],c:1,e:"Mass measures inertia: the greater the mass, the harder it is to change the object's velocity."},
{q:"In which direction is acceleration in uniform circular motion?",a:["Tangentially","Away from the centre","Towards the centre","It is zero"],c:2,e:"Centripetal acceleration points towards the centre and changes the direction of velocity."},
{q:"What is the SI unit of work?",a:["Newton","Watt","Joule","Pascal"],c:2,e:"Work is measured in joules: 1 J = 1 N·m."},
{q:"What is conserved in an isolated system during a collision?",a:["Total momentum","Each object's speed","Kinetic energy always","Acceleration"],c:0,e:"The total momentum of an isolated system is conserved regardless of the type of collision."},
{q:"How are oscillation frequency f and period T related?",a:["f = T","f = 1/T","f = T²","f = 2T"],c:1,e:"Frequency is the number of oscillations per second, so f = 1/T."},
{q:"What happens to gravitational force if distance is doubled?",a:["It doubles","It halves","It becomes four times smaller","It stays the same"],c:2,e:"By the inverse-square law, F is proportional to 1/r²; doubling distance reduces force by a factor of four."},
{q:"Which expression is Newton's second law?",a:["F = ma","p = mv","W = Fs","P = W/t"],c:0,e:"The net force equals mass times acceleration: ΣF = ma."},
{q:"What does electric current measure?",a:["Energy of a charge","Speed of light","Charge passing a cross-section per unit time","Resistance"],c:2,e:"Current I = ΔQ/Δt is the charge passing a cross-section per unit time."},
{q:"How are voltage, current and resistance related by Ohm's law?",a:["U = IR","I = UR","R = UI","U = I/R"],c:0,e:"Ohm's law is U = IR, where U is voltage, I is current and R is resistance."},
{q:"What is the gravitational potential energy of mass m at height h near Earth's surface?",a:["mv","mgh","½mv²","F/t"],c:1,e:"Near Earth's surface, gravitational potential energy relative to a chosen zero level is Eₚ = mgh."}
]};
const ui={ru:{eyebrow:"САМОПРОВЕРКА · 10 ВОПРОСОВ",title:"Проверьте знания",lead:"Тест охватывает основы механики, энергии, колебаний и электричества. Выберите один ответ в каждом вопросе и изучите пояснения.",finish:"Завершить тест",reset:"Начать заново",resultLabel:"РЕЗУЛЬТАТ",back:"← ВЕРНУТЬСЯ В АТЛАС ФИЗИКИ",count:"ВОПРОСЫ",need:"Ответьте на все вопросы, чтобы увидеть результат.",excellent:"Отличный результат!",good:"Хорошая работа!",review:"Есть темы для повторения.",explain:"Пояснение",summary:"Правильных ответов"},en:{eyebrow:"KNOWLEDGE CHECK · 10 QUESTIONS",title:"Test your knowledge",lead:"This quiz covers mechanics, energy, oscillations and electricity. Choose one answer per question and review the explanations.",finish:"Finish quiz",reset:"Start again",resultLabel:"RESULT",back:"← BACK TO THE PHYSICS ATLAS",count:"QUESTIONS",need:"Answer every question to see your result.",excellent:"Excellent result!",good:"Well done!",review:"Some topics are worth revisiting.",explain:"Explanation",summary:"Correct answers"}};
let lang="ru",answers=Array(10).fill(null),locked=false;
function render(){const d=questions[lang],u=ui[lang];document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=u[e.dataset.i]);document.getElementById("lang").textContent=lang==="ru"?"EN":"RU";document.getElementById("quiz").innerHTML=d.map((q,i)=>'<section class="question" id="q'+i+'"><div class="qhead"><b>'+(lang==="ru"?"ВОПРОС ":"QUESTION ")+(i+1).toString().padStart(2,"0")+'</b><span class="meta">'+(i+1)+' / 10</span></div><h2>'+q.q+'</h2><div class="answers">'+q.a.map((a,j)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+j+'" '+(answers[i]===j?"checked":"")+' '+(locked?"disabled":"")+'><span>'+a+'</span></label>').join("")+'</div><div class="explain"><b>'+u.explain+':</b> '+q.e+'</div></section>').join("");d.forEach((q,i)=>document.querySelectorAll('input[name="q'+i+'"]').forEach(el=>el.addEventListener("change",()=>{answers[i]=+el.value;updateProgress()})));updateProgress()}
function updateProgress(){const n=answers.filter(x=>x!==null).length;document.getElementById("counter").textContent=ui[lang].count+" · "+n+" / 10";document.getElementById("bar").style.width=(n*10)+"%"}
document.getElementById("finish").addEventListener("click",()=>{if(locked)return;if(answers.some(x=>x===null)){document.getElementById("counter").textContent=ui[lang].need;return}locked=true;const qs=questions[lang],score=answers.reduce((s,a,i)=>s+(a===qs[i].c?1:0),0);qs.forEach((q,i)=>{const el=document.getElementById("q"+i);el.classList.add("answered");el.querySelectorAll("input").forEach(x=>x.disabled=true);el.style.borderColor=answers[i]===q.c?"#39836f":"#b97958"});try{localStorage.setItem("atlas-physics-quiz-v1",JSON.stringify({score,total:10,date:new Date().toISOString()}))}catch{}const r=document.getElementById("result");r.classList.add("show");document.getElementById("score").textContent=score+" / 10";document.getElementById("rating").textContent=score>=9?ui[lang].excellent:score>=7?ui[lang].good:ui[lang].review;document.getElementById("summary").textContent=ui[lang].summary+": "+score+". "+(lang==="ru"?"Изучите пояснения к каждому вопросу.":"Review the explanations for each question.");r.scrollIntoView({behavior:"smooth",block:"center"})});
document.getElementById("reset").addEventListener("click",()=>{answers=Array(10).fill(null);locked=false;document.getElementById("result").classList.remove("show");render();window.scrollTo({top:0,behavior:"smooth"})});document.getElementById("lang").addEventListener("click",()=>{lang=lang==="ru"?"en":"ru";render()});render();
</script></body></html>
