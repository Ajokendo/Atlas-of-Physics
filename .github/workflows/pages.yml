name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Подготовить сайт
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
