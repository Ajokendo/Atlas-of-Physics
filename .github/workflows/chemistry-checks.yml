name: Chemistry atlas checks

on:
  push:
    branches: [main, portal-foundation]
    paths:
      - "chemistry/**"
      - ".github/workflows/chemistry-checks.yml"
  pull_request:
    paths:
      - "chemistry/**"
      - ".github/workflows/chemistry-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate chemistry pages, links, assets and scripts
        run: node chemistry/checks.mjs
      - name: Install Chromium for browser smoke tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
      - name: Test every Chemistry Atlas page in Chromium
        run: node chemistry/browser-smoke.mjs
