name: Chemistry atlas checks

on:
  push:
    branches: [main, portal-foundation]
    paths:
      - "chemistry/**"
      - ".github/workflows/chemistry-checks.yml"
  pull_request:
    paths:
      - "chemistry/**"
      - ".github/workflows/chemistry-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate chemistry pages, links, assets and scripts
        run: node chemistry/checks.mjs
