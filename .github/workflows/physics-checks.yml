name: Physics engine checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in original-engine/engine/*.js original-engine/kinematics/*.js original-engine/newton/*.js original-engine/circular/*.js original-engine/energy/*.js original-engine/momentum/*.js original-engine/oscillations/*.js original-engine/rotation/*.js original-engine/fluids/*.js original-engine/electrostatics/*.js original-engine/gauss/*.js original-engine/potential/*.js original-engine/capacitors/*.js original-engine/circuits/*.js original-engine/magnetism/*.js; do
            node --input-type=module --check < "$file"
          done
      - name: Check kinematics physics invariants
        run: node original-engine/kinematics/checks.mjs
      - name: Check Newton laws physics invariants
        run: node original-engine/newton/checks.mjs
      - name: Check circular motion physics invariants
        run: node original-engine/circular/checks.mjs
      - name: Check work and energy physics invariants
        run: node original-engine/energy/checks.mjs
      - name: Check momentum physics invariants
        run: node original-engine/momentum/checks.mjs
      - name: Check oscillations physics invariants
        run: node original-engine/oscillations/checks.mjs
      - name: Check rotation physics invariants
        run: node original-engine/rotation/checks.mjs
      - name: Check fluids physics invariants
        run: node original-engine/fluids/checks.mjs
      - name: Check electrostatics physics invariants
        run: node original-engine/electrostatics/checks.mjs
      - name: Check Gauss law physics invariants
        run: node original-engine/gauss/checks.mjs
      - name: Check electric potential physics invariants
        run: node original-engine/potential/checks.mjs
      - name: Check capacitors physics invariants
        run: node original-engine/capacitors/checks.mjs
      - name: Check electric circuits physics invariants
        run: node original-engine/circuits/checks.mjs
      - name: Check magnetic fields physics invariants
        run: node original-engine/magnetism/checks.mjs
